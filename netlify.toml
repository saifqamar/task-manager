# Netlify builds the web app from the repo root (pnpm workspace).
[build]
  command = "pnpm --filter @app/web... build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

# API proxy: the browser calls https://<site>.netlify.app/api/* (same origin, HTTPS)
# and Netlify forwards to the API on EC2.
[[redirects]]
  from = "/api/*"
  to = "http://taskmngr.duckdns.org/api/:splat"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

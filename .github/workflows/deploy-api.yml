name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - packages/shared/**
      - deploy/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-api.yml
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # GitHub OIDC → AWS

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on EC2 via SSM
        env:
          ECR_REPO: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/deploy
        run: |
          COMMANDS=$(jq -cn --arg raw "$RAW_BASE" --arg repo "$ECR_REPO" --arg tag "$IMAGE_TAG" '[
            "set -euo pipefail",
            "cd /opt/task-app",
            "curl -fsSL \($raw)/docker-compose.prod.yml -o docker-compose.prod.yml",
            "curl -fsSL \($raw)/deploy.sh -o deploy.sh",
            "chmod +x deploy.sh",
            "./deploy.sh \($repo) \($tag)"
          ]')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${IMAGE_TAG}" \
            --parameters "{\"commands\": $COMMANDS, \"executionTimeout\": [\"600\"]}" \
            --query Command.CommandId --output text)
          echo "SSM command: $COMMAND_ID"

          # Wait for completion (the waiter gives up after ~100s; retry until terminal state).
          for _ in $(seq 1 20); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 15
          done

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' --output yaml

          [ "$STATUS" = "Success" ] || { echo "Deployment failed: $STATUS"; exit 1; }

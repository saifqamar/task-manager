name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: taskapp
          POSTGRES_PASSWORD: taskapp
          POSTGRES_DB: taskapp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U taskapp -d taskapp_test"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://taskapp:taskapp@localhost:5432/taskapp_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared package and generate Prisma client
        run: |
          pnpm --filter @app/shared build
          pnpm --filter @app/api db:generate

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    name: Build API image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: task-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Start the image against a real Postgres: proves migrations and startup work.
      - name: Smoke test container
        run: |
          docker network create smoke
          docker run -d --name db --network smoke \
            -e POSTGRES_USER=taskapp -e POSTGRES_PASSWORD=taskapp -e POSTGRES_DB=taskapp \
            postgres:17-alpine
          until docker exec db pg_isready -h 127.0.0.1 -U taskapp -d taskapp >/dev/null 2>&1; do sleep 1; done
          docker run -d --name api --network smoke -p 3000:3000 \
            -e DATABASE_URL=postgresql://taskapp:taskapp@db:5432/taskapp \
            -e OPENWEATHER_API_KEY=ci-placeholder \
            task-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs api
          exit 1
